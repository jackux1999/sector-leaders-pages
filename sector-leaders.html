<body class="min-h-screen bg-ink text-slate-950 antialiased">
  <div class="min-h-screen bg-[linear-gradient(180deg,#f8fafc_0%,#eef2f7_100%)]">
    <div class="mx-auto grid min-h-screen w-full max-w-[1440px] grid-cols-1 lg:grid-cols-[300px_minmax(0,1fr)]">

        <div class="mb-4 flex items-start justify-between gap-3">
          <div>
            <h1 class="text-base font-semibold tracking-normal text-slate-950">A股板块龙头榜</h1>
            <p id="tradeDate" class="mt-1 text-xs leading-5 text-muted"></p>
            <p id="dataNotice" class="mt-2 rounded-md border border-amber-200 bg-amber-50 px-2.5 py-2 text-xs leading-5 text-amber-800"></p>

            搜索板块/股票

          </label>

          <div class="grid gap-1.5">
            <span class="text-xs text-muted">龙头口径</span>
            <div class="grid grid-cols-2 overflow-hidden rounded-md border border-line bg-slate-50 text-sm">
              <button id="modeTrading" class="h-9 bg-slate-950 font-semibold text-white" type="button">交易</button>
              <button id="modeIndustry" class="h-9 text-muted transition hover:bg-white hover:text-slate-950" type="button">产业</button>
            </div>
          </div>

          <label class="grid gap-1.5 text-xs text-muted">
            板块排序
            <select id="sortBy" class="h-9 rounded-md border border-line bg-slate-50 px-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:bg-white">

              <option value="change">今日涨幅</option>
              <option value="amount">成交额</option>

          </label>
        </section>

        <nav id="sectorList" class="grid max-h-[44vh] gap-2 overflow-auto pr-1 lg:max-h-[calc(100vh-238px)]"></nav>
      </aside>

      <main class="p-4 lg:p-6">
        <section class="mb-4 grid gap-3 rounded-lg border border-line bg-white p-3 shadow-soft md:grid-cols-[1fr_auto] md:items-center">
          <div class="flex flex-wrap items-center gap-2">
            <span class="rounded-md bg-slate-950 px-2.5 py-1 text-xs font-medium text-white">Market Monitor</span>
            <span class="text-sm font-semibold text-slate-950">主板行业强度观察</span>
            <span class="text-xs text-muted">数据仅作看盘辅助，不构成投资建议</span>
          </div>
          <div class="flex flex-wrap items-center gap-2 text-xs text-muted">
            <button id="refreshOnce" class="rounded-full border border-line bg-white px-2.5 py-1 text-xs font-medium text-slate-700 transition hover:border-slate-300 hover:bg-slate-50" type="button">刷新一次</button>
            <span class="rounded-full bg-slate-100 px-2.5 py-1">龙一到龙五</span>
            <span class="rounded-full bg-slate-100 px-2.5 py-1">主板过滤</span>

        <header class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
          <div>
            <div class="mb-2 flex flex-wrap items-center gap-2">

          <aside class="rounded-lg border border-line bg-white shadow-soft">
            <div class="flex items-center justify-between border-b border-line bg-panel2 p-3">
              <p class="text-sm font-semibold text-slate-950">入选理由</p>
              <span id="selectedRank" class="rounded-full border border-line px-2.5 py-1 text-xs text-muted"></span>
            </div>
            <div class="p-4">
              <h3 id="selectedName" class="text-base font-semibold text-slate-950"></h3>
              <p id="selectedCode" class="mt-1 text-xs text-muted"></p>

            </div>

              <div class="flex items-center justify-between gap-3">
                <p class="text-sm font-semibold text-slate-950">胜率分析</p>
                <button id="analyzeOdds" class="rounded-md bg-slate-950 px-2.5 py-1.5 text-xs font-medium text-white transition hover:bg-slate-800" type="button">分析</button>
              </div>
              <div class="grid gap-2">
                <label class="grid gap-1 text-xs text-muted">
                  火山 API Key
                  <input id="volcApiKey" class="h-9 rounded-md border border-line bg-slate-50 px-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:bg-white" type="password" autocomplete="off" placeholder="本地输入，不写入数据文件">
                </label>
                <label class="grid gap-1 text-xs text-muted">
                  模型 / Endpoint ID
                  <input id="volcModel" class="h-9 rounded-md border border-line bg-slate-50 px-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:bg-white" type="text" placeholder="ep-xxxxxxxx">
                </label>

              <div id="analysisResult" class="min-h-24 whitespace-pre-line rounded-md border border-line bg-slate-50 p-3 text-sm leading-6 text-slate-700">点击分析后调用火山接口。</div>
            </div>
            <div class="grid gap-2 border-t border-line p-4 text-xs text-muted">
              <div class="flex items-center justify-between gap-3"><span>观察一</span><strong class="font-medium text-slate-700">是否继续放量</strong></div>
              <div class="flex items-center justify-between gap-3"><span>观察二</span><strong class="font-medium text-slate-700">板块是否扩散</strong></div>
              <div class="flex items-center justify-between gap-3"><span>观察三</span><strong class="font-medium text-slate-700">龙一断板后龙二承接</strong></div>
            </div>
          </aside>
        </section>
      </main>
    </div>
  </div>

  <script src="data/sectors-data.js"></script>
  <script>
    const EXCLUDED_PREFIXES = ["300", "301", "688"];
    const REFRESH_INTERVAL_MS = 5 * 60 * 1000;
    const VOLC_CHAT_COMPLETIONS_URL = "https://ark.cn-beijing.volces.com/api/v3/chat/completions";
    const CLIENT_SECTOR_CONFIG = [
      {
        id: "mlcc",
        name: "MLCC",
        summary: "主板 MLCC/被动元件股票池，交易时间每 5 分钟刷新一次行情强度。",
        industry: ["风华高科", "洁美科技", "顺络电子", "火炬电子", "博迁新材"],
        stocks: ["000636", "002859", "002138", "603678", "605218", "002484", "600563", "002463", "002436", "603738"]
      },
      {
        id: "lithium",
        name: "锂电",
        summary: "主板锂电股票池，观察材料、资源和电池链主板弹性。",
        industry: ["天赐材料", "赣锋锂业", "恩捷股份", "天齐锂业", "融捷股份"],
        stocks: ["002709", "002460", "002812", "002466", "002074", "002340", "002176", "600884", "603659", "603799", "002756", "002594"]
      },
      {
        id: "robot",
        name: "机器人",
        summary: "主板机器人股票池，重点看减速器、电机、控制和工业机器人环节。",
        industry: ["中大力德", "埃斯顿", "鸣志电器", "柯力传感", "巨轮智能"],
        stocks: ["002896", "002747", "603728", "002527", "002031", "603662", "603960", "002472", "002559", "603666", "603015"]
      },
      {
        id: "cpo",
        name: "CPO",
        summary: "主板光通信/CPO股票池，观察 AI 算力链在主板的资金映射。",
        industry: ["华工科技", "光迅科技", "中天科技", "亨通光电", "中兴通讯"],
        stocks: ["000988", "002281", "600522", "600487", "000063", "002463", "002929", "600498", "002396", "002902"]
      },
      {
        id: "chip",
        name: "半导体",
        summary: "主板半导体股票池，聚焦设备、封测、功率半导体和存储链。",
        industry: ["北方华创", "兆易创新", "通富微电", "韦尔股份", "士兰微"],
        stocks: ["002371", "603986", "002156", "603501", "002049", "600584", "600460", "002185", "600703", "002409", "605358"]
      },
      {
        id: "solid",
        name: "固态电池",
        summary: "主板固态电池股票池，观察资源、材料和设备端强弱。",
        industry: ["赣锋锂业", "天赐材料", "恩捷股份", "上海洗霸", "天齐锂业"],
        stocks: ["603200", "002460", "002709", "002812", "002074", "002466", "002340", "002176", "600884", "603799"]
      }
    ];
    const fallbackSectors = [
      {
        id: "mlcc",
        name: "MLCC",
        change: 0,
        amount: 0,
        heat: 0,
        summary: "暂无生成数据，请运行 python3 generate-sector-data.py 更新。",
        trading: [],
        industry: []
      }
    ];

    const rawSectors = Array.isArray(window.SECTOR_DATA?.sectors) && window.SECTOR_DATA.sectors.length
      ? window.SECTOR_DATA.sectors
      : fallbackSectors;
    const dataSourceName = window.SECTOR_DATA?.source || "";
    const canUseClientRefresh = !dataSourceName || dataSourceName.includes("新浪");

    const allowedStock = stock => !EXCLUDED_PREFIXES.some(prefix => String(stock.code).padStart(6, "0").startsWith(prefix));
    let sectors = rawSectors
      .map(sector => {
        const trading = (sector.trading || []).filter(allowedStock);
        const industry = (sector.industry || []).filter(name => trading.some(stock => stock.name === name));
        return { ...sector, trading, industry: industry.length ? industry : trading.map(stock => stock.name).slice(0, 3) };
      })
      .filter(sector => sector.trading.length);

    let activeSectorId = sectors[0]?.id;
    let mode = "trading";
    let selectedIndex = 0;
    let activeAnalysisKey = "";

    const fmtPct = value => `${value > 0 ? "+" : ""}${Number(value || 0).toFixed(2)}%`;
    const fmtAmount = value => `${Number(value || 0).toFixed(1)}亿`;
    const tone = value => Number(value || 0) >= 0 ? "text-rise" : "text-fall";

    function score(stock) {
      const clippedChange = Math.max(-10, Math.min(Number(stock.change || 0), 10));
      const changeScore = ((clippedChange + 10) / 20) * 55;
      const amountScore = Math.min(Number(stock.amount || 0) / 80, 1) * 30;
      const turnoverScore = Math.min(Number(stock.turnover || 0) / 15, 1) * 10;
      const limitScore = stock.limit ? 5 : 0;
      return Math.round(changeScore + amountScore + turnoverScore + limitScore);
    }

    function marketSymbol(code) {
      const normalized = String(code).padStart(6, "0");
      return `${normalized.startsWith("6") || normalized.startsWith("9") ? "sh" : "sz"}${normalized}`;
    }

    function parseSinaQuote(code) {
      const symbol = marketSymbol(code);
      const raw = window[`hq_str_${symbol}`];
      if (!raw) return null;
      const parts = raw.split(",");
      if (parts.length < 32 || !parts[0]) return null;
      const prevClose = Number(parts[2]);
      const current = Number(parts[3]);
      if (!prevClose || !current) return null;
      const change = ((current - prevClose) / prevClose) * 100;
      return {
        name: parts[0],
        code: String(code).padStart(6, "0"),
        change,
        amount: Number(parts[9] || 0) / 100000000,
        turnover: 0,
        limit: change >= 9.8,
        date: parts[30] || "",
        time: parts[31] || "",
      };
    }

    function quoteReason(stock, sectorName) {
      if (stock.limit) return `${sectorName}板块内涨停，短线辨识度较高。`;
      if (stock.amount >= 50) return `${sectorName}板块内成交额居前，是观察板块强弱的重要锚点。`;
      if (stock.change > 0) return `${sectorName}板块内涨幅靠前，资金活跃度相对更高。`;
      return `${sectorName}板块内弱中相对强，适合观察是否率先修复。`;
    }

    function industryScore(stock, names) {
      const index = names.indexOf(stock.name);
      if (index >= 0) return Math.max(82, 98 - index * 4);
      return Math.min(84, Math.max(60, score(stock) + 8));
    }

    function buildLiveSectors() {
      return CLIENT_SECTOR_CONFIG.map(config => {
        const stocks = config.stocks
          .filter(code => !EXCLUDED_PREFIXES.some(prefix => String(code).startsWith(prefix)))
          .map(code => parseSinaQuote(code))
          .filter(Boolean)
          .map(stock => ({
            ...stock,
            change: Number(stock.change.toFixed(2)),
            amount: Number(stock.amount.toFixed(2)),
            reason: quoteReason(stock, config.name),
            industryScore: industryScore(stock, config.industry)
          }))
          .sort((a, b) => score(b) - score(a));
        const leaders = stocks.slice(0, 5);
        const industry = config.industry.filter(name => leaders.some(stock => stock.name === name));
        industry.push(...leaders.map(stock => stock.name).filter(name => !industry.includes(name)));
        const change = stocks.length ? stocks.reduce((sum, stock) => sum + stock.change, 0) / stocks.length : 0;
        return {
          id: config.id,
          name: config.name,
          change: Number(change.toFixed(2)),
          amount: Number(stocks.reduce((sum, stock) => sum + stock.amount, 0).toFixed(1)),
          heat: leaders.length ? Math.round(leaders.reduce((sum, stock) => sum + score(stock), 0) / leaders.length) : 0,
          summary: config.summary,
          trading: leaders,
          industry: industry.slice(0, 5)
        };
      }).filter(sector => sector.trading.length);
    }

    function loadSinaQuotes(codes) {
      return new Promise((resolve, reject) => {
        const id = `sinaQuote${Date.now()}`;
        const script = document.createElement("script");
        script.id = id;
        script.charset = "gbk";
        script.src = `https://hq.sinajs.cn/list=${codes.map(marketSymbol).join(",")}&_=${Date.now()}`;
        script.onload = () => {
          script.remove();
          resolve();
        };
        script.onerror = () => {
          script.remove();
          reject(new Error("行情接口加载失败"));
        };
        document.head.appendChild(script);
      });
    }

    function chinaNow() {
      const parts = new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        weekday: "short"
      }).formatToParts(new Date());
      const value = type => parts.find(part => part.type === type)?.value || "";
      return {
        weekday: value("weekday"),
        hour: Number(value("hour")),
        minute: Number(value("minute")),
        second: Number(value("second"))
      };
    }

    function isTradingTime() {
      const now = chinaNow();
      if (["周六", "周日", "Sat", "Sun"].includes(now.weekday)) return false;
      const minutes = now.hour * 60 + now.minute;
      return (minutes >= 9 * 60 + 30 && minutes <= 11 * 60 + 30) ||
        (minutes >= 13 * 60 && minutes <= 15 * 60);
    }

    let lastRefreshAt = 0;
    async function refreshQuotes(force = false) {
      if (!canUseClientRefresh) return;
      const now = Date.now();
      if (!force && (!isTradingTime() || now - lastRefreshAt < REFRESH_INTERVAL_MS)) return;
      const allCodes = [...new Set(CLIENT_SECTOR_CONFIG.flatMap(sector => sector.stocks))]
        .filter(code => !EXCLUDED_PREFIXES.some(prefix => String(code).startsWith(prefix)));
      document.querySelector("#refreshStatus").textContent = "刷新中";
      try {
        await loadSinaQuotes(allCodes);
        const liveSectors = buildLiveSectors();
        if (liveSectors.length) {
          sectors = liveSectors;
          if (!sectors.some(sector => sector.id === activeSectorId)) activeSectorId = sectors[0]?.id;
          selectedIndex = 0;
          lastRefreshAt = Date.now();
          const refreshedAt = new Date();
          document.querySelector("#refreshStatus").textContent = `已刷新 ${formatTime(refreshedAt)}`;
          document.querySelector("#tradeDate").textContent = `实时观察 · 最后刷新 ${formatDateTime(refreshedAt)} · 新浪行情 · 手动刷新`;
          updateDataNotice("新浪行情/自维护股票池", window.SECTOR_DATA?.errors || []);
          render();
        }
      } catch (error) {
        document.querySelector("#refreshStatus").textContent = "刷新失败";
      }
    }

    function rankedStocks(sector) {
      if (mode === "industry") {
        const byName = Object.fromEntries(sector.trading.map(stock => [stock.name, stock]));
        return sector.industry.map(name => byName[name]).filter(Boolean).slice(0, 5);
      }
      return [...sector.trading].sort((a, b) => score(b) - score(a)).slice(0, 5);
    }

    function selectedContext() {
      const sector = sectors.find(item => item.id === activeSectorId) || sectors[0];
      if (!sector) return {};
      const stocks = rankedStocks(sector);
      return { sector, stocks, stock: stocks[selectedIndex] || stocks[0] };
    }

    function filteredSectors() {
      const term = document.querySelector("#search").value.trim().toLowerCase();
      const sortBy = document.querySelector("#sortBy").value;
      const sorted = [...sectors].sort((a, b) => {
        if (sortBy === "change") return Number(b.change || 0) - Number(a.change || 0);
        if (sortBy === "amount") return Number(b.amount || 0) - Number(a.amount || 0);
        return Number(b.heat || 0) - Number(a.heat || 0);
      });
      if (!term) return sorted;
      return sorted.filter(sector => {
        const stocks = sector.trading.map(stock => `${stock.name}${stock.code}`).join("");
        return `${sector.name}${stocks}`.toLowerCase().includes(term);
      });
    }

    function renderSectors() {
      const list = document.querySelector("#sectorList");
      const items = filteredSectors();
      list.innerHTML = items.map(sector => `
        <button type="button" data-id="${sector.id}" class="group rounded-lg border p-3 text-left shadow-sm transition ${sector.id === activeSectorId ? "border-slate-950 bg-slate-950 text-white shadow-soft" : "border-line bg-white hover:border-slate-300 hover:bg-slate-50"}">
          <div class="flex items-center justify-between gap-3">
            <span class="text-sm font-semibold ${sector.id === activeSectorId ? "text-white" : "text-slate-950"}">${sector.name}</span>
            <span class="text-sm font-semibold ${tone(sector.change)}">${fmtPct(sector.change)}</span>
          </div>
          <div class="mt-2 flex items-center justify-between gap-3 text-xs ${sector.id === activeSectorId ? "text-slate-300" : "text-muted"}">
            <span>成交 ${fmtAmount(sector.amount)}</span>
            <span>热度 ${sector.heat || 0}</span>
          </div>
        </button>
      `).join("");
      list.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          activeSectorId = button.dataset.id;
          selectedIndex = 0;
          render();
        });
      });
    }

    function renderScoreGrid(stock) {
      const items = [
        ["涨幅", Math.round(((Math.max(-10, Math.min(Number(stock.change || 0), 10)) + 10) / 20) * 100)],
        ["成交额", Math.round(Math.min(Number(stock.amount || 0) / 80, 1) * 100)],
        ["换手", Math.round(Math.min(Number(stock.turnover || 0) / 15, 1) * 100)],
        ["产业", Number(stock.industryScore || 60)]
      ];
      document.querySelector("#scoreGrid").innerHTML = items.map(([label, value]) => `
        <div class="grid grid-cols-[52px_minmax(0,1fr)_36px] items-center gap-2 text-xs text-muted">
          <span>${label}</span>
          <div class="h-1.5 overflow-hidden rounded-full bg-slate-100">
            <span class="block h-full rounded-full bg-slate-950" style="width:${value}%"></span>
          </div>
          <strong class="text-right font-medium text-slate-700">${value}</strong>
        </div>
      `).join("");
    }

    function renderMain() {
      const sector = sectors.find(item => item.id === activeSectorId) || sectors[0];
      if (!sector) return;
      const stocks = rankedStocks(sector);
      const selected = stocks[selectedIndex] || stocks[0];
      if (!selected) return;
      const limitCount = sector.trading.filter(stock => stock.limit).length;

      document.querySelector("#sectorTitle").textContent = sector.name;
      document.querySelector("#sectorSummary").textContent = sector.summary || "";
      document.querySelector("#ruleChip").textContent = mode === "trading" ? "短线交易口径" : "产业地位口径";
      document.querySelector("#mChange").className = `mt-2 block text-base ${tone(sector.change)}`;
      document.querySelector("#mChange").textContent = fmtPct(sector.change);
      document.querySelector("#mAmount").textContent = fmtAmount(sector.amount);
      document.querySelector("#mLimit").textContent = `${limitCount} 只`;
      document.querySelector("#mPool").textContent = `${sector.trading.length} 只`;

      document.querySelector("#leaderRows").innerHTML = stocks.map((stock, index) => {
        const rankName = ["龙一", "龙二", "龙三", "龙四", "龙五"][index] || `第${index + 1}`;
        const rankColor = index === 0 ? "bg-gold text-slate-950" : index === 1 ? "bg-slate-300 text-slate-950" : index === 2 ? "bg-orange-300 text-slate-950" : "bg-slate-700 text-slate-100";
        const value = mode === "trading" ? score(stock) : Number(stock.industryScore || 60);
        return `
          <tr data-index="${index}" class="cursor-pointer transition hover:bg-slate-50">
            <td class="px-3 py-3"><span class="inline-flex h-8 w-8 items-center justify-center rounded-md text-sm font-bold ${rankColor}">${index + 1}</span></td>
            <td class="px-3 py-3">
              <div class="text-sm font-semibold text-slate-950">${stock.name}</div>
              <div class="mt-1 text-xs text-muted">${stock.code} · ${rankName}</div>
            </td>
            <td class="px-3 py-3 text-sm font-semibold ${tone(stock.change)}">${fmtPct(stock.change)}</td>
            <td class="px-3 py-3 text-sm text-slate-700">${fmtAmount(stock.amount)}</td>
            <td class="px-3 py-3 text-sm text-slate-700">${Number(stock.turnover || 0).toFixed(1)}%</td>
            <td class="px-3 py-3"><span class="rounded-full border border-line px-2 py-1 text-xs text-muted">${stock.limit ? "涨停" : "趋势"}</span></td>
            <td class="px-3 py-3">
              <div class="h-1.5 w-28 overflow-hidden rounded-full bg-slate-100">
                <span class="block h-full rounded-full bg-slate-950" style="width:${value}%"></span>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      document.querySelectorAll("#leaderRows tr").forEach(row => {
        row.addEventListener("click", () => {
          selectedIndex = Number(row.dataset.index);
          renderMain();
        });
      });

      document.querySelector("#selectedRank").textContent = ["龙一", "龙二", "龙三", "龙四", "龙五"][selectedIndex] || `第${selectedIndex + 1}`;
      document.querySelector("#selectedName").textContent = selected.name;
      document.querySelector("#selectedCode").textContent = `${selected.code} · ${mode === "trading" ? "交易强度" : "产业地位"}`;
      document.querySelector("#selectedReason").textContent = selected.reason || "";
      renderScoreGrid(selected);
      const analysisKey = `${sector.id}-${selected.code}`;
      if (analysisKey !== activeAnalysisKey) {
        activeAnalysisKey = analysisKey;
        document.querySelector("#analysisResult").textContent = "点击分析后调用火山接口。";
      }
    }

    function render() {
      renderSectors();
      renderMain();
    }

    function updateDataNotice(sourceName, errors = []) {
      const notice = document.querySelector("#dataNotice");
      const sourceText = sourceName || "示例数据";
      const warnings = [];
      if (sourceText.includes("新浪")) {
        warnings.push("当前为新浪备用行情，换手率不可用，板块成份股来自自维护股票池。");
      }
      if (sourceText.includes("同花顺")) {
        warnings.push("当前为 AkShare/同花顺行业板块数据，自动取行业热度前五及各行业前五股票。");
      }
      if (sourceText.includes("示例")) {
        warnings.push("当前展示示例数据，请运行脚本生成真实行情后再用于复盘。");
      }
      if (errors.length) {
        warnings.push("数据源曾发生降级，请以页面显示的数据源为准。");
      }
      notice.textContent = warnings.length
        ? warnings.join(" ")
        : "当前为 AkShare/东方财富行业板块数据，自动取行业热度前五及各行业前五股票，仍仅作看盘辅助。";
      notice.className = warnings.length
        ? "mt-2 rounded-md border border-amber-200 bg-amber-50 px-2.5 py-2 text-xs leading-5 text-amber-800"
        : "mt-2 rounded-md border border-emerald-200 bg-emerald-50 px-2.5 py-2 text-xs leading-5 text-emerald-800";
    }

    function formatDateTime(date) {
      return date.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function formatTime(date) {
      return date.toLocaleTimeString("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
    }

    function stockMetrics(stock) {
      return [
        `涨跌幅 ${fmtPct(stock.change)}`,
        `成交额 ${fmtAmount(stock.amount)}`,
        `换手率 ${Number(stock.turnover || 0).toFixed(1)}%`,
        `市盈率 ${Number(stock.pe || 0) ? Number(stock.pe).toFixed(2) : "暂无"}`,
        `市净率 ${Number(stock.pb || 0) ? Number(stock.pb).toFixed(2) : "暂无"}`,
        `流通市值 ${Number(stock.marketCap || 0) ? fmtAmount(stock.marketCap) : "暂无"}`,
        `现价 ${Number(stock.price || 0) ? Number(stock.price).toFixed(2) : "暂无"}`
      ].join("，");
    }

    function buildAnalysisPrompt(sector, stocks, stock) {
      const peers = stocks.map((item, index) => {
        const rankName = ["龙一", "龙二", "龙三", "龙四", "龙五"][index] || `第${index + 1}`;
        return `${rankName} ${item.name}(${item.code})：${stockMetrics(item)}`;
      }).join("\n");
      return [
        `请分析 A 股短线博弈胜率。`,
        `当前行业：${sector.name}`,
        `行业涨跌幅：${fmtPct(sector.change)}，行业成交额：${fmtAmount(sector.amount)}，行业热度：${sector.heat || 0}`,
        `目标股票：${stock.name}(${stock.code})`,
        `目标数据：${stockMetrics(stock)}`,
        `入选理由：${stock.reason || "暂无"}`,
        `行业前五：\n${peers}`,
        `请结合交易强度、市盈率、市净率、业绩可见度、基本面质量、行业强度和风险收益比给出结论。`,
        `如果输入里没有业绩或基本面事实，请明确写“业绩/基本面：本地数据不足，需补充财报数据”，不要编造具体营收利润。`,
        `输出固定包含：基本面分析、估值与业绩、市盈率/市净率评价、交易结构、风险点、博弈分数(0-100)、预估胜率(百分比)、是否值得博弈(值得/谨慎/不值得)、触发条件。`,
        `这只是看盘辅助，不构成投资建议。`
      ].join("\n");
    }

    async function analyzeOdds() {
      const { sector, stocks, stock } = selectedContext();
      const apiKey = document.querySelector("#volcApiKey").value.trim();
      const model = document.querySelector("#volcModel").value.trim();
      const result = document.querySelector("#analysisResult");
      const button = document.querySelector("#analyzeOdds");
      if (!sector || !stock) return;
      if (!apiKey || !model) {
        result.textContent = "请先输入火山 API Key 和模型 / Endpoint ID。";
        return;
      }
      localStorage.setItem("volcModel", model);
      result.textContent = "分析中...";
      button.disabled = true;
      button.className = "rounded-md bg-slate-400 px-2.5 py-1.5 text-xs font-medium text-white";
      try {
        const response = await fetch(VOLC_CHAT_COMPLETIONS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model,
            temperature: 0.2,
            messages: [
              {
                role: "system",
                content: "你是谨慎的A股交易与基本面分析助手。只基于用户给出的数据和明确常识做概率分析，不承诺收益，不给确定性买卖建议。"
              },
              {
                role: "user",
                content: buildAnalysisPrompt(sector, stocks, stock)
              }
            ]
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.error?.message || data?.message || `请求失败：${response.status}`);
        }
        result.textContent = data?.choices?.[0]?.message?.content || "接口没有返回分析内容。";
      } catch (error) {
        result.textContent = `分析失败：${error.message || error}`;
      } finally {
        button.disabled = false;
        button.className = "rounded-md bg-slate-950 px-2.5 py-1.5 text-xs font-medium text-white transition hover:bg-slate-800";
      }
    }

    const generatedAt = window.SECTOR_DATA?.generatedAt ? new Date(window.SECTOR_DATA.generatedAt) : new Date();
    const source = window.SECTOR_DATA?.source ? ` · ${window.SECTOR_DATA.source}` : " · 示例数据";
    document.querySelector("#tradeDate").textContent = `盘后观察 · 最后刷新 ${formatDateTime(generatedAt)}${source}`;
    updateDataNotice(window.SECTOR_DATA?.source, window.SECTOR_DATA?.errors || []);
    document.querySelector("#search").addEventListener("input", renderSectors);
    document.querySelector("#sortBy").addEventListener("change", renderSectors);
    document.querySelector("#refreshOnce").addEventListener("click", () => {
      if (!canUseClientRefresh) {
        document.querySelector("#refreshStatus").textContent = "请运行脚本刷新";
        return;
      }
      refreshQuotes(true);
    });
    document.querySelector("#volcModel").value = localStorage.getItem("volcModel") || "";
    document.querySelector("#analyzeOdds").addEventListener("click", analyzeOdds);
    document.querySelector("#modeTrading").addEventListener("click", () => {
      mode = "trading";
      selectedIndex = 0;
      document.querySelector("#modeTrading").className = "h-9 bg-slate-950 font-semibold text-white";
      document.querySelector("#modeIndustry").className = "h-9 text-muted transition hover:bg-white hover:text-slate-950";
      render();
    });
    document.querySelector("#modeIndustry").addEventListener("click", () => {
      mode = "industry";
      selectedIndex = 0;
      document.querySelector("#modeIndustry").className = "h-9 bg-slate-950 font-semibold text-white";
      document.querySelector("#modeTrading").className = "h-9 text-muted transition hover:bg-white hover:text-slate-950";
      render();
    });

    render();
  </script>
</body>
</html>
